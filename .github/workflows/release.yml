name: Release

# Builds the signed installers for a version tag (v0.1.0) and attaches them,
# their signatures and the update feed (latest.json) to a draft GitHub
# release. Publishing the draft stays a manual step; only published releases
# reach the in-app updater (ADR 0014).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  installers:
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu, so the Linux packages run on older
        # distributions too (glibc).
        os: [windows-latest, ubuntu-22.04, windows-11-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: The tag matches the app version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the workspace version $version"
            exit 1
          fi
      - name: The update signing key is available
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (docs/RELEASE.md)"
            exit 1
          fi
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build signed installers
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json
      # The runner is elevated, so WebView2 ignores the debugging port from
      # the environment; a machine policy sets it (docs/RELEASE.md).
      - name: WebView2 debugging port for the smoke test (runner only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'jarvis.exe' -Value '--remote-debugging-port=9333' -PropertyType String -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'JARVIS_SMOKE_DEVTOOLS_PORT=9333'
      # Install, smoke test the installed program, uninstall (the rpm is not
      # installable on Ubuntu runners).
      - name: Install test (NSIS)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: node e2e/install-test.mjs nsis ../../target/release/bundle --plugin ../../examples/plugins/text-tools/server.mjs
      - name: Install test (MSI)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: node e2e/install-test.mjs msi ../../target/release/bundle
      - name: Install test (deb)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: xvfb-run -a node e2e/install-test.mjs deb ../../target/release/bundle
      - name: Install test (AppImage)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: xvfb-run -a node e2e/install-test.mjs appimage ../../target/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/nsis/*-setup.exe*
            target/release/bundle/msi/*.msi*
            target/release/bundle/deb/*.deb*
            target/release/bundle/rpm/*.rpm*
            target/release/bundle/appimage/*.AppImage*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release
    needs: installers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      # The artifacts keep the bundler's folders (nsis/, msi/, deb/, ...);
      # the feed, the checksums and the release take the files side by side.
      - name: Collect the files
        run: |
          mkdir dist
          find artifacts -type f -exec mv -n -t dist {} +
          left=$(find artifacts -type f | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::$left files share a name with another installer"
            exit 1
          fi
          ls -l dist
      - name: Update feed
        run: node .github/scripts/latest-json.mjs dist "$TAG" "${{ github.repository }}"
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # "Which file do I need?" first, then the generated list of changes.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(sed "s/{version}/${TAG#v}/g" .github/scripts/release-notes.md)
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --draft --generate-notes --notes "$notes" \
            --title "JARVIS ${TAG#v}"
