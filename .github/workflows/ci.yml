name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (format, lint, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run test:ci
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test --workspace --locked
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
      # Job logs need a GitHub sign-in; annotations are public, so failing
      # tests are reported there too.
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          grep -E -A 30 '^---- .* stdout ----$' "$RUNNER_TEMP/cargo-test.log" \
            | head -c 6000 > "$RUNNER_TEMP/failures.txt" || true
          if [ -s "$RUNNER_TEMP/failures.txt" ]; then
            body=$(tr -d '\r' < "$RUNNER_TEMP/failures.txt" | sed -e 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')
            echo "::error title=Failing tests (${{ matrix.os }})::${body}"
          fi
      - name: Generated TypeScript bindings are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- packages/shared-types

  desktop:
    name: Desktop build (${{ matrix.os }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build release binary (frontend + Tauri, no installer)
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-${{ runner.os }}
          path: |
            target/release/jarvis
            target/release/jarvis.exe
          if-no-files-found: error
          retention-days: 7
