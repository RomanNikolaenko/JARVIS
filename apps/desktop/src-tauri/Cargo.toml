[package]
name = "jarvis-desktop"
description = "JARVIS desktop shell: Tauri 2 host for the Angular UI and the Rust core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "jarvis-desktop"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
jarvis-ai.workspace = true
jarvis-core.workspace = true
jarvis-events.workspace = true
jarvis-platform.workspace = true
serde.workspace = true
tauri.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
ts-rs.workspace = true

[lints]
workspace = true
