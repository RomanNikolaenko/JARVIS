[workspace]
resolver = "3"
members = [
    "crates/jarvis-events",
    "crates/jarvis-platform",
    "crates/jarvis-ai",
    "crates/jarvis-runtime",
    "crates/jarvis-storage",
    "crates/jarvis-memory",
    "crates/jarvis-security",
    "crates/jarvis-tools",
    "crates/jarvis-agent",
    "crates/jarvis-plugins",
    "crates/jarvis-voice",
    "crates/jarvis-vision",
    "crates/jarvis-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
# Internal crates
jarvis-agent = { path = "crates/jarvis-agent" }
jarvis-ai = { path = "crates/jarvis-ai" }
jarvis-core = { path = "crates/jarvis-core" }
jarvis-events = { path = "crates/jarvis-events" }
jarvis-platform = { path = "crates/jarvis-platform" }
jarvis-plugins = { path = "crates/jarvis-plugins" }
jarvis-memory = { path = "crates/jarvis-memory" }
jarvis-runtime = { path = "crates/jarvis-runtime" }
jarvis-security = { path = "crates/jarvis-security" }
jarvis-tools = { path = "crates/jarvis-tools" }
jarvis-voice = { path = "crates/jarvis-voice" }
jarvis-vision = { path = "crates/jarvis-vision" }
jarvis-storage = { path = "crates/jarvis-storage" }

# Async runtime and utilities
async-trait = "0.1.89"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1.47", default-features = false }
tokio-util = { version = "0.7.16", default-features = false }

# Serialization and errors
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "1.0"
ts-rs = { version = "12.0", features = ["uuid-impl"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# Networking (AI provider HTTP APIs). No system proxy: local AI traffic must
# never be routed through a proxy implicitly.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
url = "2.5"

# Local runtime: verified downloads and archive extraction
flate2 = "1.1"
sha2 = "0.10"
tar = "0.4.44"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Secrets in OS keychain (Windows Credential Manager / Linux Secret Service)
keyring = "3"

# Voice: audio I/O (WASAPI / ALSA) and voice activity detection
cpal = "0.18"
earshot = "1.2"

# Vision: images for vision models; screen capture on Windows (xcap), X11
# (x11rb, pure Rust) and Wayland (xdg-desktop-portal through ashpd)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9"
x11rb = { version = "0.14", features = ["randr"] }
ashpd = { version = "0.13", default-features = false, features = ["screenshot", "tokio"] }
base64 = "0.22"

# Local database (bundled SQLite with FTS5)
rusqlite = { version = "0.40", features = ["bundled"] }

# Observability
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

# Platform
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Desktop shell
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
# Signed updates (ADR 0014): no system proxy, no legacy zip bundles.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }

# Testing
tempfile = "3.20"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

# Image decoding, resizing and encoding are unusably slow without
# optimizations, even in development builds.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

# Resizing is generic code, compiled into the crate that calls it.
[profile.dev.package.jarvis-vision]
opt-level = 3

# SHA-256 of downloads, engines and plugin programs (hundreds of MB).
[profile.dev.package.sha2]
opt-level = 3
