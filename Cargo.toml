[workspace]
resolver = "3"
members = [
    "crates/jarvis-events",
    "crates/jarvis-platform",
    "crates/jarvis-ai",
    "crates/jarvis-runtime",
    "crates/jarvis-core",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
# Internal crates
jarvis-ai = { path = "crates/jarvis-ai" }
jarvis-core = { path = "crates/jarvis-core" }
jarvis-events = { path = "crates/jarvis-events" }
jarvis-platform = { path = "crates/jarvis-platform" }
jarvis-runtime = { path = "crates/jarvis-runtime" }

# Async runtime and utilities
async-trait = "0.1.89"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1.47", default-features = false }
tokio-util = { version = "0.7.16", default-features = false }

# Serialization and errors
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "1.0"
ts-rs = { version = "12.0", features = ["uuid-impl"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# Networking (AI provider HTTP APIs). No system proxy: local AI traffic must
# never be routed through a proxy implicitly.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
url = "2.5"

# Local runtime: verified downloads and archive extraction
flate2 = "1.1"
sha2 = "0.10"
tar = "0.4.44"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Observability
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

# Platform
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Desktop shell
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"

# Testing
tempfile = "3.20"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
