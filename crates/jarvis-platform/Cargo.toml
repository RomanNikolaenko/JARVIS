[package]
name = "jarvis-platform"
description = "Cross-platform system layer for JARVIS: OS detection, hardware detection and resource monitoring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop", "process-group"] }
tokio = { workspace = true, features = ["process"] }
serde.workspace = true
sysinfo = { workspace = true, features = ["disk"] }
tracing.workspace = true
ts-rs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
