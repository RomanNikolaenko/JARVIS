[package]
name = "jarvis-runtime"
description = "Embedded local inference for JARVIS: managed llama.cpp server, GGUF model library and verified downloads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
flate2.workspace = true
futures.workspace = true
jarvis-ai.workspace = true
jarvis-events.workspace = true
jarvis-platform.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
ts-rs.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true

[features]
# Fake llama-server and helpers for tests of dependent crates.
test-support = []

[dev-dependencies]
jarvis-runtime = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
