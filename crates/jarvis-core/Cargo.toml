[package]
name = "jarvis-core"
description = "JARVIS core: composition root of the domain layer (configuration, health, chat orchestration)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
jarvis-ai.workspace = true
jarvis-events.workspace = true
jarvis-platform.workspace = true
jarvis-runtime.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[dev-dependencies]
jarvis-runtime = { workspace = true, features = ["test-support"] }
