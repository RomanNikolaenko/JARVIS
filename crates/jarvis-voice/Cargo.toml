[package]
name = "jarvis-voice"
description = "JARVIS voice engine: audio capture and playback, voice activity detection, wake word, speech-to-text and text-to-speech."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
cpal.workspace = true
earshot.workspace = true
jarvis-platform.workspace = true
jarvis-runtime.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
ts-rs.workspace = true
url.workspace = true
uuid.workspace = true

[features]
# Fake audio devices and engines for tests of dependent crates.
test-support = []

[dev-dependencies]
jarvis-voice = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
